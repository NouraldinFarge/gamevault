[package]
name = "gamevault"
version = "0.3.1"
description = "Portable local game library and launcher"
authors = ["GameVault contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "gamevault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "GameVault"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
rfd = "0.17"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
walkdir = "2.5"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
