name: Verified Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, and publish portable release
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: project/workspace

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0
          run_install: false

      - name: Confirm tag and version identity
        working-directory: project/workspace
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath VERSION).Trim()
          $status = Get-Content -Raw -LiteralPath release-status.json | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version."
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release publication requires a stable semantic version; found $version."
          }
          if ($status.sourceVersion -ne $version -or $status.targetVersion -ne $version -or $status.sourceStatus -ne 'release-ready') {
            throw "release-status.json must match the stable VERSION and declare sourceStatus=release-ready."
          }

      - name: Build and verify portable package
        working-directory: project/workspace
        shell: pwsh
        env:
          GAMEVAULT_SIGNING_PFX_BASE64: ${{ secrets.GAMEVAULT_SIGNING_PFX_BASE64 }}
          GAMEVAULT_SIGNING_PFX_PASSWORD: ${{ secrets.GAMEVAULT_SIGNING_PFX_PASSWORD }}
          GAMEVAULT_SIGNING_TIMESTAMP_URL: ${{ vars.GAMEVAULT_SIGNING_TIMESTAMP_URL }}
        run: ./BUILD-LATEST.ps1

      - name: Prepare release assets and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $archives = @(Get-ChildItem project/portable-builds -Filter 'GameVault-*-windows-x64-portable.zip')
          if ($archives.Count -ne 1) { throw "Expected exactly one GameVault archive; found $($archives.Count)." }
          $archive = $archives[0]
          Copy-Item -LiteralPath $archive.FullName -Destination release
          $copied = Join-Path (Resolve-Path release) $archive.Name
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $copied).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Set-Content -Encoding ascii -LiteralPath "$copied.sha256"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: project/workspace
          format: spdx-json
          output-file: release/gamevault-${{ github.ref_name }}-sbom.spdx.json
          upload-artifact: false

      - name: Attest portable package provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/*.zip

      - name: Publish verified GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes --title "GameVault $env:GITHUB_REF_NAME"
